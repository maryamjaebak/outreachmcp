[project]
name = "outreach-mcp"
version = "0.1.0"
description = "MCP server providing cold-outreach tools for student societies: search, scoring, and learning from decisions"
license = "MIT"
authors = [
    { name = "Maryam", email = "jaebak.maryam@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3.0",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "trafilatura>=2.3.1",
]

[project.scripts]
outreach-mcp = "outreach_mcp:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.17.0",
    "responses>=0.26.3",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
